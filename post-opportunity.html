<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Opportunity | Opportunity Zambia 🇿🇲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4faf6;
      color: #222;
    }

    header {
      background: #087f3f;
      color: white;
      padding: 18px 20px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #087f3f;
      margin-top: 0;
    }

    .intro {
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #087f3f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #066b35;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <a href="employer-dashboard.html">← Employer Dashboard 🇿🇲</a>
</header>

<div class="container">

  <div class="card">

    <h1>📢 Post an Opportunity</h1>

    <p class="intro">
      Connect with young Zambians looking for genuine opportunities.
    </p>

    <form id="opportunityForm">

      <label for="title">Opportunity Title *</label>
      <input
        type="text"
        id="title"
        placeholder="e.g. Driver"
        required
      >

      <label for="description">Description *</label>
      <textarea
        id="description"
        placeholder="Describe the opportunity..."
        required
      ></textarea>

      <label for="organization">Company / Organization *</label>
      <input
        type="text"
        id="organization"
        placeholder="Company name"
        required
      >

      <label for="location">Location *</label>
      <input
        type="text"
        id="location"
        placeholder="e.g. Lusaka"
        required
      >

      <label for="opportunity_type">Opportunity Type *</label>
      <select id="opportunity_type" required>
        <option value="">Select type</option>
        <option value="Job">Job</option>
        <option value="Internship">Internship</option>
        <option value="Apprenticeship">Apprenticeship</option>
        <option value="Training">Training</option>
        <option value="Business Opportunity">Business Opportunity</option>
        <option value="Freelance Work">Freelance Work</option>
      </select>

      <label for="category">Category</label>
      <input
        type="text"
        id="category"
        placeholder="e.g. Technology, Driving, Sales"
      >

      <label for="requirements">Requirements</label>
      <textarea
        id="requirements"
        placeholder="What skills or qualifications are required?"
      ></textarea>

      <label for="application_link">Application Link</label>
      <input
        type="url"
        id="application_link"
        placeholder="https://..."
      >

      <label for="deadline">Application Deadline</label>
      <input
        type="date"
        id="deadline"
      >

      <button type="submit">
        🚀 Post Opportunity
      </button>

    </form>

    <div id="message"></div>

  </div>

</div>

<footer>
  Learn → Build → Work → Earn 🇿🇲
</footer>

<script>
  const SUPABASE_URL = "https://jawhldlfwvgrbothjjkz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Mr-wTes1EIURPO5r39gSSA_p19xR3Ey";

  const token = localStorage.getItem("oz_access_token");
  const userId = localStorage.getItem("oz_user_id");

  const form = document.getElementById("opportunityForm");
  const message = document.getElementById("message");

  if (!token || !userId) {
    message.style.display = "block";
    message.style.background = "#ffe5e5";
    message.style.color = "#b00020";
    message.innerHTML =
      "Please log in to an employer account before posting an opportunity.";
    form.style.display = "none";
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    message.style.display = "block";
    message.style.background = "#fff3cd";
    message.style.color = "#856404";
    message.innerHTML = "Posting your opportunity...";

    const opportunity = {
      title: document.getElementById("title").value.trim(),
      description: document.getElementById("description").value.trim(),
      organization: document.getElementById("organization").value.trim(),
      location: document.getElementById("location").value.trim(),
      opportunity_type: document.getElementById("opportunity_type").value,
      category: document.getElementById("category").value.trim(),
      requirements: document.getElementById("requirements").value.trim(),
      application_link: document.getElementById("application_link").value.trim() || null,
      deadline: document.getElementById("deadline").value || null,

      /* THIS CONNECTS THE OPPORTUNITY TO THE EMPLOYER */
      employer_id: userId,

      /* New opportunities start active and unverified */
      verified: false,
      status: "active"
    };

    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/opportunities",
        {
          method: "POST",

          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + token,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },

          body: JSON.stringify(opportunity)
        }
      );

      const data = await response.json();

      if (!response.ok) {
        throw new Error(
          data.message ||
          data.error_description ||
          "Could not post opportunity."
        );
      }

      message.style.background = "#d4edda";
      message.style.color = "#155724";

      message.innerHTML =
        "🎉 Opportunity posted successfully! 🇿🇲<br><br>" +
        "Your opportunity has been added to Opportunity Zambia.";

      form.reset();

      setTimeout(function() {
        window.location.href = "employer-dashboard.html";
      }, 1500);

    } catch (error) {

      console.error(error);

      message.style.background = "#ffe5e5";
      message.style.color = "#b00020";

      message.innerHTML =
        "❌ " + error.message;
    }

  });
</script>

</body>
</html>
