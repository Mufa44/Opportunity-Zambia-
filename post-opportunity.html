<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post Opportunity | Opportunity Zambia 🇿🇲</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f8f5;
  color: #222;
}

header {
  background: #087f3f;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input, textarea, select {
  width: 100%;
  padding: 12px;
  margin: 8px 0 16px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 7px;
}

textarea {
  min-height: 120px;
}

button {
  width: 100%;
  padding: 14px;
  background: #087f3f;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #056b34;
}

#message {
  margin-top: 15px;
  font-weight: bold;
}

a {
  color: #087f3f;
}
</style>
</head>

<body>

<header>
  <h1>🚀 Post Opportunity</h1>
  <p>Opportunity Zambia 🇿🇲</p>
</header>

<div class="container">

  <p><a href="employer-dashboard.html">← Back to Dashboard</a></p>

  <form id="opportunityForm">

    <label>Opportunity Title</label>
    <input id="title" required placeholder="e.g. Driver">

    <label>Description</label>
    <textarea id="description" required
      placeholder="Describe the opportunity"></textarea>

    <label>Opportunity Type</label>
    <select id="opportunity_type" required>
      <option value="">Select type</option>
      <option>Job</option>
      <option>Internship</option>
      <option>Apprenticeship</option>
      <option>Training</option>
      <option>Business Opportunity</option>
      <option>Freelance Work</option>
    </select>

    <label>Category</label>
    <input id="category" placeholder="e.g. Technology, Transport">

    <label>Location</label>
    <input id="location" placeholder="e.g. Lusaka">

    <label>Requirements</label>
    <textarea id="requirements"
      placeholder="Skills, qualifications or requirements"></textarea>

    <label>Application Link</label>
    <input id="application_link"
      placeholder="WhatsApp number, email or application link">

    <label>Deadline</label>
    <input id="deadline" type="date">

    <button type="submit">🚀 Post Opportunity</button>

  </form>

  <div id="message"></div>

</div>

<script>

const SUPABASE_URL =
  "https://jawhldlfwvgrbothjjkz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Mr-wTes1EIURPO5r39gSSA_p19xR3Ey";

let accessToken = localStorage.getItem("oz_access_token");
let currentUser = null;


/* =========================
   REFRESH LOGIN SESSION
========================= */

async function refreshSession() {

  const refreshToken =
    localStorage.getItem("oz_refresh_token");

  if (!refreshToken) {
    throw new Error("No refresh token found. Please login again.");
  }

  const response = await fetch(
    SUPABASE_URL +
    "/auth/v1/token?grant_type=refresh_token",
    {
      method: "POST",
      headers: {
        "apikey": SUPABASE_KEY,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        refresh_token: refreshToken
      })
    }
  );

  const data = await response.json();

  if (!response.ok) {
    console.log("Refresh error:", data);
    throw new Error("Your login session has expired. Please login again.");
  }

  accessToken = data.access_token;

  localStorage.setItem(
    "oz_access_token",
    data.access_token
  );

  if (data.refresh_token) {
    localStorage.setItem(
      "oz_refresh_token",
      data.refresh_token
    );
  }

  return accessToken;
}


/* =========================
   GET CURRENT USER
========================= */

async function getCurrentUser() {

  if (!accessToken) {
    throw new Error("Please login first.");
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1/user",
    {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + accessToken
      }
    }
  );

  const data = await response.json();

  if (!response.ok) {
    throw new Error("Unable to verify your account.");
  }

  currentUser = data;

  localStorage.setItem(
    "oz_user_id",
    currentUser.id
  );

  console.log("LOGGED IN USER:", currentUser.id);

  return currentUser;
}


/* =========================
   CHECK LOGIN
========================= */

async function initialise() {

  try {

    if (!accessToken) {
      await refreshSession();
    }

    try {
      await getCurrentUser();
    } catch (error) {
      await refreshSession();
      await getCurrentUser();
    }

  } catch (error) {

    document.getElementById("message").innerHTML =
      "❌ " + error.message +
      ' <a href="auth.html">Login again</a>';

    document.getElementById("opportunityForm")
      .style.display = "none";
  }
}

initialise();


/* =========================
   POST OPPORTUNITY
========================= */

document
.getElementById("opportunityForm")
.addEventListener("submit", async function(event) {

  event.preventDefault();

  const message =
    document.getElementById("message");

  message.innerHTML = "⏳ Posting opportunity...";

  try {

    /*
      Always refresh immediately before posting.
      This guarantees we use a fresh authenticated JWT.
    */

    await refreshSession();

    await getCurrentUser();

    if (!currentUser || !currentUser.id) {
      throw new Error("Could not identify your employer account.");
    }

    const opportunity = {

      title:
        document.getElementById("title").value.trim(),

      description:
        document.getElementById("description").value.trim(),

      organization:
        "Mufa phone hun",

      location:
        document.getElementById("location").value.trim(),

      opportunity_type:
        document.getElementById("opportunity_type").value,

      category:
        document.getElementById("category").value.trim(),

      requirements:
        document.getElementById("requirements").value.trim(),

      application_link:
        document.getElementById("application_link").value.trim(),

      deadline:
        document.getElementById("deadline").value || null,

      employer_id:
        currentUser.id,

      verified:
        false,

      status:
        "active"
    };


    console.log(
      "POSTING AS EMPLOYER:",
      currentUser.id
    );

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/opportunities",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + accessToken,

          "Content-Type":
            "application/json",

          "Prefer":
            "return=representation"
        },

        body:
          JSON.stringify(opportunity)
      }
    );

    const result =
      await response.json();

    console.log("SUPABASE RESPONSE:", result);

    if (!response.ok) {

      throw new Error(
        result.message ||
        result.error_description ||
        result.details ||
        result.hint ||
        JSON.stringify(result)
      );
    }


    message.innerHTML =
      "🎉 Opportunity posted successfully! 🇿🇲";

    document.getElementById("opportunityForm")
      .reset();

    setTimeout(function() {

      window.location.href =
        "employer-dashboard.html";

    }, 1200);


  } catch (error) {

    console.error(error);

    message.innerHTML =
      "❌ " + error.message;
  }

});

</script>

</body>
</html>
