<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Opportunity | Opportunity Zambia 🇿🇲</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4faf6;
      color: #222;
    }

    header {
      background: #087f3f;
      color: white;
      padding: 18px 20px;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h1 {
      color: #087f3f;
      margin-top: 0;
    }

    .intro {
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 16px;
      margin-bottom: 7px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      background: #087f3f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #066b35;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

<header>
  <a href="employer-dashboard.html">← Employer Dashboard 🇿🇲</a>
</header>

<div class="container">
  <div class="card">

    <h1>📢 Post an Opportunity</h1>

    <p class="intro">
      Connect with young Zambians looking for genuine opportunities.
    </p>

    <form id="opportunityForm">

      <label>Opportunity Title *</label>
      <input id="title" type="text" placeholder="e.g. Driver" required>

      <label>Description *</label>
      <textarea id="description"
        placeholder="Describe the opportunity..."
        required></textarea>

      <label>Company / Organization *</label>
      <input id="organization"
        type="text"
        placeholder="Company name"
        required>

      <label>Location *</label>
      <input id="location"
        type="text"
        placeholder="e.g. Lusaka"
        required>

      <label>Opportunity Type *</label>
      <select id="opportunity_type" required>
        <option value="">Select type</option>
        <option value="Job">Job</option>
        <option value="Internship">Internship</option>
        <option value="Apprenticeship">Apprenticeship</option>
        <option value="Training">Training</option>
        <option value="Business Opportunity">Business Opportunity</option>
        <option value="Freelance Work">Freelance Work</option>
      </select>

      <label>Category</label>
      <input id="category"
        type="text"
        placeholder="e.g. Technology, Driving, Sales">

      <label>Requirements</label>
      <textarea id="requirements"
        placeholder="What skills or qualifications are required?"></textarea>

      <label>Application Link</label>
      <input id="application_link"
        type="url"
        placeholder="https://...">

      <label>Application Deadline</label>
      <input id="deadline" type="date">

      <button id="submitButton" type="submit">
        🚀 Post Opportunity
      </button>

    </form>

    <div id="message"></div>

  </div>
</div>

<footer>
  Learn → Build → Work → Earn 🇿🇲
</footer>

<script>

const SUPABASE_URL =
  "https://jawhldlfwvgrbothjjkz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Mr-wTes1EIURPO5r39gSSA_p19xR3Ey";

const token =
  localStorage.getItem("oz_access_token");

const form =
  document.getElementById("opportunityForm");

const message =
  document.getElementById("message");

const submitButton =
  document.getElementById("submitButton");

let currentUser = null;


/* Show message */
function showMessage(text, background, color) {
  message.style.display = "block";
  message.style.background = background;
  message.style.color = color;
  message.textContent = text;
}


/* Check login */
if (!token) {
  showMessage(
    "❌ Please log in as an employer first.",
    "#ffe5e5",
    "#b00020"
  );

  submitButton.disabled = true;
}


/* Load logged-in user */
async function loadUser() {

  if (!token) return;

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token
        }
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.message || data.error_description || "Login session expired.");
    }

    currentUser = data;

    localStorage.setItem(
      "oz_user_id",
      currentUser.id
    );

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ Your login session has expired. Please log in again.",
      "#ffe5e5",
      "#b00020"
    );

    submitButton.disabled = true;
  }
}


/* Submit opportunity */
form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!currentUser) {

    showMessage(
      "❌ Please log in as an employer first.",
      "#ffe5e5",
      "#b00020"
    );

    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "⏳ Posting...";

  const opportunity = {

    employer_id: currentUser.id,

    title: document.getElementById("title").value.trim(),

    description:
      document.getElementById("description").value.trim(),

    organization:
      document.getElementById("organization").value.trim(),

    location:
      document.getElementById("location").value.trim(),

    opportunity_type:
      document.getElementById("opportunity_type").value,

    category:
      document.getElementById("category").value.trim(),

    requirements:
      document.getElementById("requirements").value.trim(),

    application_link:
      document.getElementById("application_link").value.trim() || null,

    deadline:
      document.getElementById("deadline").value || null,

    verified: false,

    status: "active"
  };


  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/opportunities",
      {
        method: "POST",

        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          "Prefer": "return=representation"
        },

        body: JSON.stringify(opportunity)
      }
    );


    const result = await response.json();


    if (!response.ok) {

      console.error("Supabase error:", result);

      throw new Error(
        result.message ||
        result.details ||
        result.hint ||
        result.error_description ||
        "Could not post opportunity."
      );
    }


    showMessage(
      "🎉 Opportunity posted successfully! 🇿🇲",
      "#dff7e8",
      "#087f3f"
    );


    form.reset();


    setTimeout(function() {

      window.location.href =
        "employer-dashboard.html";

    }, 1500);


  } catch (error) {

    console.error(error);

    showMessage(
      "❌ " + error.message,
      "#ffe5e5",
      "#b00020"
    );

    submitButton.disabled = false;
    submitButton.textContent = "🚀 Post Opportunity";
  }

});


/* Start */
loadUser();

</script>

</body>
</html>
