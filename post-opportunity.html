<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Post Opportunity | Opportunity Zambia 🇿🇲</title>

<style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  background: #f4f8f5;
  color: #222;
}

header {
  background: #087f3f;
  color: white;
  padding: 20px;
  text-align: center;
}

.container {
  max-width: 650px;
  margin: 30px auto;
  background: white;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.08);
}

input,
textarea,
select {
  width: 100%;
  padding: 12px;
  margin: 8px 0 16px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 7px;
}

textarea {
  min-height: 120px;
}

button {
  width: 100%;
  padding: 14px;
  background: #087f3f;
  color: white;
  border: none;
  border-radius: 7px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #056b34;
}

#message {
  margin-top: 15px;
  font-weight: bold;
}

a {
  color: #087f3f;
}
</style>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<header>
  <h1>🚀 Post Opportunity</h1>
  <p>Opportunity Zambia 🇿🇲</p>
</header>

<div class="container">

  <p>
    <a href="employer-dashboard.html">
      ← Back to Dashboard
    </a>
  </p>

  <form id="opportunityForm">

    <label>Opportunity Title</label>
    <input
      id="title"
      required
      placeholder="e.g. Driver"
    >

    <label>Description</label>
    <textarea
      id="description"
      required
      placeholder="Describe the opportunity"
    ></textarea>

    <label>Opportunity Type</label>

    <select id="opportunity_type" required>

      <option value="">Select type</option>

      <option value="Job">
        Job
      </option>

      <option value="Internship">
        Internship
      </option>

      <option value="Apprenticeship">
        Apprenticeship
      </option>

      <option value="Training">
        Training
      </option>

      <option value="Business Opportunity">
        Business Opportunity
      </option>

      <option value="Freelance Work">
        Freelance Work
      </option>

    </select>

    <label>Category</label>

    <input
      id="category"
      placeholder="e.g. Technology, Transport"
    >

    <label>Location</label>

    <input
      id="location"
      placeholder="e.g. Lusaka"
    >

    <label>Requirements</label>

    <textarea
      id="requirements"
      placeholder="Skills, qualifications or requirements"
    ></textarea>

    <label>Application Link</label>

    <input
      id="application_link"
      placeholder="WhatsApp number, email or application link"
    >

    <label>Deadline</label>

    <input
      id="deadline"
      type="date"
    >

    <button type="submit">
      🚀 Post Opportunity
    </button>

  </form>

  <div id="message"></div>

</div>


<script>

const SUPABASE_URL =
  "https://jawhldlfwvgrbothjjkz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Mr-wTes1EIURPO5r39gSSA_p19xR3Ey";


const supabase = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


const message =
  document.getElementById("message");


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin() {

  const accessToken =
    localStorage.getItem("oz_access_token");

  const refreshToken =
    localStorage.getItem("oz_refresh_token");

  if (!accessToken || !refreshToken) {

    message.innerHTML =
      '❌ Please login first. <a href="auth.html">Login</a>';

    document.getElementById("opportunityForm")
      .style.display = "none";

    return false;
  }


  /*
    Give Supabase the same session
    created by your login page.
  */

  const { data, error } =
    await supabase.auth.setSession({

      access_token: accessToken,

      refresh_token: refreshToken

    });


  if (error) {

    console.error(
      "Session error:",
      error
    );

    message.innerHTML =
      '❌ Your login session has expired. <a href="auth.html">Login again</a>';

    document.getElementById("opportunityForm")
      .style.display = "none";

    return false;
  }


  /*
    Save refreshed tokens.
  */

  if (data.session) {

    localStorage.setItem(
      "oz_access_token",
      data.session.access_token
    );

    localStorage.setItem(
      "oz_refresh_token",
      data.session.refresh_token
    );

  }


  const user =
    data.user;


  if (!user) {

    message.innerHTML =
      '❌ Please login first. <a href="auth.html">Login</a>';

    document.getElementById("opportunityForm")
      .style.display = "none";

    return false;
  }


  /*
    Save the real authenticated
    Supabase user ID.
  */

  localStorage.setItem(
    "oz_user_id",
    user.id
  );


  console.log(
    "AUTHENTICATED USER:",
    user.id
  );


  return true;
}


/* =========================
   START
========================= */

checkLogin();


/* =========================
   POST OPPORTUNITY
========================= */

document
  .getElementById("opportunityForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      message.innerHTML =
        "⏳ Posting opportunity...";


      try {

        /*
          Get the current Supabase
          authenticated user.
        */

        const {
          data: {
            user
          },
          error: userError
        } =
          await supabase.auth.getUser();


        if (userError) {

          throw userError;

        }


        if (!user) {

          throw new Error(
            "Please login again."
          );

        }


        /*
          IMPORTANT:
          This is the ID that RLS
          compares with employer_id.
        */

        const employerId =
          user.id;


        console.log(
          "EMPLOYER ID:",
          employerId
        );


        const opportunity = {

          title:
            document
              .getElementById("title")
              .value
              .trim(),

          description:
            document
              .getElementById("description")
              .value
              .trim(),

          organization:
            "Mufa phone hun",

          location:
            document
              .getElementById("location")
              .value
              .trim(),

          opportunity_type:
            document
              .getElementById("opportunity_type")
              .value,

          category:
            document
              .getElementById("category")
              .value
              .trim(),

          requirements:
            document
              .getElementById("requirements")
              .value
              .trim(),

          application_link:
            document
              .getElementById("application_link")
              .value
              .trim(),

          deadline:
            document
              .getElementById("deadline")
              .value || null,

          employer_id:
            employerId,

          verified:
            false,

          status:
            "active"

        };


        console.log(
          "OPPORTUNITY:",
          opportunity
        );


        /*
          Insert using the authenticated
          Supabase client.
        */

        const {
          data,
          error
        } =
          await supabase
            .from("opportunities")
            .insert([
              opportunity
            ])
            .select();


        if (error) {

          console.error(
            "SUPABASE ERROR:",
            error
          );

          throw error;

        }


        console.log(
          "SUCCESS:",
          data
        );


        message.innerHTML =
          "🎉 Opportunity posted successfully! 🇿🇲";


        document
          .getElementById("opportunityForm")
          .reset();


        /*
          Go back to employer dashboard.
        */

        setTimeout(
          function() {

            window.location.href =
              "employer-dashboard.html";

          },
          1200
        );


      } catch (error) {

        console.error(
          "POST ERROR:",
          error
        );


        message.innerHTML =
          "❌ " +
          (
            error.message ||
            "Unable to post opportunity."
          );

      }

    }
  );

</script>

</body>
</html>
