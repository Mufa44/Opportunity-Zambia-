<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Profile | Opportunity Zambia 🇿🇲</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4fff8;
      color: #222;
    }

    header {
      background: #087f3f;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h1 {
      color: #087f3f;
      text-align: center;
    }

    .intro {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 15px;
      margin-bottom: 6px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input[readonly] {
      background: #eee;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #087f3f;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      background: #777;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
      display: none;
      white-space: pre-wrap;
    }

    .success {
      display: block !important;
      background: #dff7e8;
      color: #087f3f;
    }

    .error {
      display: block !important;
      background: #ffe1e1;
      color: #b00020;
    }

    .loading {
      display: block !important;
      background: #fff4cc;
      color: #765900;
    }
  </style>
</head>

<body>

<header>
  <a href="index.html">← Opportunity Zambia 🇿🇲</a>
</header>

<div class="container">

  <div class="card">

    <h1>Create Your Profile</h1>

    <p class="intro">
      Showcase your skills, education and experience so opportunities can find you.
    </p>

    <form id="profileForm">

      <label>First Name *</label>
      <input type="text" id="first_name" required>

      <label>Last Name *</label>
      <input type="text" id="last_name" required>

      <label>Province / Location</label>
      <input type="text" id="location" placeholder="e.g. Lusaka">

      <label>Phone</label>
      <input type="text" id="phone" placeholder="e.g. 097xxxxxxx">

      <label>Email</label>
      <input type="email" id="email" readonly>

      <label>About You</label>
      <textarea id="about" placeholder="Tell employers about yourself"></textarea>

      <label>Skills</label>
      <textarea id="skills" placeholder="e.g. Driving, Computer Skills, Sales"></textarea>

      <label>Education</label>
      <select id="education">
        <option value="">Select education level</option>
        <option>Grade 12</option>
        <option>Certificate</option>
        <option>Diploma</option>
        <option>Degree</option>
        <option>Postgraduate</option>
        <option>Other</option>
      </select>

      <label>School / College / University</label>
      <input type="text" id="school">

      <label>Experience</label>
      <textarea id="experience" placeholder="Describe your work experience"></textarea>

      <label>Opportunity Type</label>
      <select id="opportunity_type">
        <option value="">Select opportunity type</option>
        <option>Job</option>
        <option>Internship</option>
        <option>Apprenticeship</option>
        <option>Training</option>
        <option>Business Opportunity</option>
        <option>Freelance Work</option>
      </select>

      <label>Area of Interest</label>
      <input type="text" id="area_of_interest" placeholder="e.g. Technology, Business, Construction">

      <label>Portfolio Link</label>
      <input type="url" id="portfolio" placeholder="https://...">

      <label>LinkedIn</label>
      <input type="url" id="linkedin" placeholder="https://linkedin.com/...">

      <button type="submit" id="saveButton">
        💾 Save Profile
      </button>

      <div id="message"></div>

    </form>

  </div>

</div>

<script>

const SUPABASE_URL = "https://jawhldlfwvgrbothjjkz.supabase.co";
const SUPABASE_KEY = "sb_publishable_Mr-wTes1EIURPO5r39gSSA_p19xR3Ey";

const token = localStorage.getItem("oz_access_token");
const storedUserId = localStorage.getItem("oz_user_id");

const form = document.getElementById("profileForm");
const message = document.getElementById("message");
const saveButton = document.getElementById("saveButton");
const emailField = document.getElementById("email");

function showMessage(text, type) {
  message.textContent = text;
  message.className = type;
}

async function loadUser() {

  if (!token || !storedUserId) {
    showMessage(
      "⚠️ You are not logged in. Please login first.",
      "error"
    );

    saveButton.disabled = true;
    return;
  }

  try {

    const response = await fetch(
      SUPABASE_URL + "/auth/v1/user",
      {
        method: "GET",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token
        }
      }
    );

    const user = await response.json();

    if (!response.ok) {
      throw new Error(user.msg || user.message || "Could not load your account.");
    }

    emailField.value = user.email || "";

  } catch (error) {

    showMessage(
      "⚠️ Could not load your account: " + error.message,
      "error"
    );

    saveButton.disabled = true;
  }
}


form.addEventListener("submit", async function(event) {

  event.preventDefault();

  if (!token || !storedUserId) {
    showMessage(
      "⚠️ Please login before saving your profile.",
      "error"
    );
    return;
  }

  const firstName = document.getElementById("first_name").value.trim();
  const lastName = document.getElementById("last_name").value.trim();

  if (!firstName || !lastName) {
    showMessage(
      "⚠️ Please enter your First Name and Last Name.",
      "error"
    );
    return;
  }

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";

  showMessage(
    "⏳ Saving your profile...",
    "loading"
  );

  const profileData = {
    user_id: storedUserId,
    first_name: firstName,
    last_name: lastName,
    location: document.getElementById("location").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    email: emailField.value.trim(),
    about: document.getElementById("about").value.trim(),
    skills: document.getElementById("skills").value.trim(),
    education: document.getElementById("education").value,
    school: document.getElementById("school").value.trim(),
    experience: document.getElementById("experience").value.trim(),
    opportunity_type: document.getElementById("opportunity_type").value,
    area_of_interest: document.getElementById("area_of_interest").value.trim(),
    portfolio: document.getElementById("portfolio").value.trim(),
    linkedin: document.getElementById("linkedin").value.trim()
  };

  try {

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/profiles",
      {
        method: "POST",
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + token,
          "Content-Type": "application/json",
          "Prefer": "return=minimal"
        },
        body: JSON.stringify(profileData)
      }
    );

    const responseText = await response.text();

    if (!response.ok) {

      let errorMessage = responseText;

      try {
        const errorData = JSON.parse(responseText);
        errorMessage =
          errorData.message ||
          errorData.msg ||
          errorData.hint ||
          errorData.details ||
          responseText;
      } catch (e) {}

      throw new Error(errorMessage);
    }

    showMessage(
      "🎉 Profile saved successfully! 🇿🇲",
      "success"
    );

    saveButton.textContent = "✅ Profile Saved";

  } catch (error) {

    console.error("Profile save error:", error);

    showMessage(
      "❌ Profile could not be saved.\n\n" + error.message,
      "error"
    );

    saveButton.disabled = false;
    saveButton.textContent = "💾 Save Profile";
  }

});

loadUser();

</script>

</body>
</html>
