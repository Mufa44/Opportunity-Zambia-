<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Find Opportunities | Opportunity Zambia 🇿🇲</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f8f5;
  color: #17231a;
}

header {
  background: #087f3f;
  color: white;
  padding: 18px 6%;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.hero {
  background: linear-gradient(135deg, #087f3f, #0aa957);
  color: white;
  text-align: center;
  padding: 55px 20px;
}

.hero h1 {
  font-size: clamp(34px, 7vw, 52px);
  margin: 0 0 15px;
}

.hero p {
  max-width: 650px;
  margin: auto;
  line-height: 1.6;
}

.container {
  max-width: 1000px;
  margin: 35px auto;
  padding: 0 20px;
}

.search-box {
  background: white;
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,.08);
  margin-bottom: 30px;
}

.search-box input,
.search-box select {
  width: 100%;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ccd8cf;
  border-radius: 9px;
  font-size: 15px;
  background: white;
}

.cards {
  display: grid;
  gap: 20px;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 15px;
  box-shadow: 0 4px 18px rgba(0,0,0,.07);
}

.card h2 {
  color: #087f3f;
  margin-top: 0;
  margin-bottom: 12px;
}

.badge {
  display: inline-block;
  background: #e8f5ec;
  color: #087f3f;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
  margin: 3px;
}

.card p {
  line-height: 1.6;
}

.apply {
  display: inline-block;
  background: #087f3f;
  color: white;
  text-decoration: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
  margin-top: 10px;
}

.apply:hover {
  background: #066b35;
}

#message {
  text-align: center;
  padding: 20px;
  font-weight: bold;
}

.loading {
  color: #087f3f;
}

.error {
  color: #b00020;
}

.empty {
  color: #555;
}

footer {
  background: #063d21;
  color: white;
  text-align: center;
  padding: 25px;
  margin-top: 50px;
}

@media (min-width: 700px) {
  .search-box {
    display: grid;
    grid-template-columns: 2fr 1fr 1fr;
    gap: 12px;
  }

  .search-box input,
  .search-box select {
    margin-bottom: 0;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">
    🇿🇲 Opportunity Zambia
  </div>

  <a href="index.html">
    ← Home
  </a>
</header>

<section class="hero">
  <h1>Find Your Opportunity</h1>

  <p>
    Discover jobs, internships, apprenticeships, training and other
    opportunities across Zambia.
  </p>
</section>

<div class="container">

  <div class="search-box">

    <input
      id="search"
      type="text"
      placeholder="🔎 Search opportunities..."
      autocomplete="off"
    >

    <select id="type">
      <option value="">All opportunity types</option>
      <option value="Job">Job</option>
      <option value="Internship">Internship</option>
      <option value="Apprenticeship">Apprenticeship</option>
      <option value="Training">Training</option>
      <option value="Business Opportunity">Business Opportunity</option>
      <option value="Freelance Work">Freelance Work</option>
    </select>

    <select id="province">
      <option value="">All provinces</option>
      <option value="Lusaka">Lusaka</option>
      <option value="Copperbelt">Copperbelt</option>
      <option value="Central">Central</option>
      <option value="Eastern">Eastern</option>
      <option value="Luapula">Luapula</option>
      <option value="Northern">Northern</option>
      <option value="Muchinga">Muchinga</option>
      <option value="North-Western">North-Western</option>
      <option value="Southern">Southern</option>
      <option value="Western">Western</option>
    </select>

  </div>

  <div id="message" class="loading">
    Loading opportunities...
  </div>

  <div class="cards" id="opportunities"></div>

</div>

<footer>
  © 2026 Opportunity Zambia 🇿🇲
  <br><br>
  Learn → Build → Work → Earn
</footer>

<script>

const SUPABASE_URL =
  "https://jawhldlfwvgrbothjjkz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_Mr-wTes1EIURPO5r39gSSA_p19xR3Ey";

let allOpportunities = [];


/* =========================
   LOAD OPPORTUNITIES
========================= */

async function loadOpportunities() {

  const message = document.getElementById("message");

  message.className = "loading";
  message.textContent = "Loading opportunities...";

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/opportunities" +
      "?select=*" +
      "&order=created_at.desc";

    const response = await fetch(url, {
      method: "GET",
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json"
      }
    });

    if (!response.ok) {

      const errorText = await response.text();

      console.error(
        "Supabase error:",
        response.status,
        errorText
      );

      throw new Error(
        "Supabase returned " + response.status
      );
    }

    const data = await response.json();

    console.log("Supabase opportunities:", data);

    allOpportunities = Array.isArray(data) ? data : [];

    displayOpportunities(allOpportunities);

  } catch (error) {

    console.error("Opportunity loading error:", error);

    message.className = "error";

    message.textContent =
      "❌ Could not load opportunities. Please try again.";

  }
}


/* =========================
   DISPLAY OPPORTUNITIES
========================= */

function displayOpportunities(list) {

  const container =
    document.getElementById("opportunities");

  const message =
    document.getElementById("message");

  container.innerHTML = "";

  if (!Array.isArray(list) || list.length === 0) {

    message.className = "empty";

    message.textContent =
      "No opportunities found.";

    return;
  }

  message.className = "";

  message.textContent =
    list.length +
    " opportunit" +
    (list.length === 1 ? "y" : "ies") +
    " found.";


  list.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "card";


    const title =
      item.title || "Untitled Opportunity";

    const type =
      item.opportunity_type || "Opportunity";

    const category =
      item.category || "General";

    const location =
      item.location || "Zambia";

    const description =
      item.description || "No description provided.";

    const organization =
      item.organization || "Not specified";

    const requirements =
      item.requirements || "Not specified";

    const deadline =
      item.deadline || "Not specified";

    const id =
      item.id || "";


    card.innerHTML = `

      <h2>
        ${escapeHTML(title)}
      </h2>

      <span class="badge">
        ${escapeHTML(type)}
      </span>

      <span class="badge">
        ${escapeHTML(category)}
      </span>

      <span class="badge">
        📍 ${escapeHTML(location)}
      </span>

      <p>
        ${escapeHTML(description)}
      </p>

      <p>
        <strong>Organization:</strong><br>
        ${escapeHTML(organization)}
      </p>

      <p>
        <strong>Requirements:</strong><br>
        ${escapeHTML(requirements)}
      </p>

      <p>
        <strong>Deadline:</strong><br>
        ${escapeHTML(deadline)}
      </p>

      ${
        id
        ? `
          <a
            class="apply"
            href="apply.html?id=${encodeURIComponent(id)}"
          >
            🚀 Apply Now
          </a>
        `
        : `
          <span class="badge">
            Application unavailable
          </span>
        `
      }

    `;

    container.appendChild(card);

  });

}


/* =========================
   FILTER OPPORTUNITIES
========================= */

function filterOpportunities() {

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const type =
    document
      .getElementById("type")
      .value
      .trim()
      .toLowerCase();

  const province =
    document
      .getElementById("province")
      .value
      .trim()
      .toLowerCase();


  const filtered =
    allOpportunities.filter(item => {

      const title =
        String(item.title || "");

      const description =
        String(item.description || "");

      const category =
        String(item.category || "");

      const organization =
        String(item.organization || "");

      const location =
        String(item.location || "");

      const opportunityType =
        String(item.opportunity_type || "");


      const searchableText =
        (
          title + " " +
          description + " " +
          category + " " +
          organization + " " +
          location
        ).toLowerCase();


      const matchesSearch =
        searchableText.includes(search);


      const matchesType =
        type === "" ||
        opportunityType.toLowerCase() === type;


      /*
       * Use includes() instead of exact matching.
       * This allows locations such as:
       * "Lusaka"
       * "Lusaka, Zambia"
       * "Lusaka Province"
       */
      const matchesProvince =
        province === "" ||
        location.toLowerCase().includes(province);


      return (
        matchesSearch &&
        matchesType &&
        matchesProvince
      );

    });


  displayOpportunities(filtered);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  return String(value)

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");
}


/* =========================
   EVENTS
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    filterOpportunities
  );


document
  .getElementById("type")
  .addEventListener(
    "change",
    filterOpportunities
  );


document
  .getElementById("province")
  .addEventListener(
    "change",
    filterOpportunities
  );


/* =========================
   START
========================= */

loadOpportunities();

</script>

</body>
</html>
